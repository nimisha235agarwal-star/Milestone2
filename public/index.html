<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groww | HDFC Mutual Fund Assistant</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="groww_logo.svg" alt="Groww" class="groww-logo-img">
                <h1 class="logo-text">Groww<span style="color: var(--primary)">AI</span></h1>
            </div>
            <div class="nav-links">
                <a href="#">Stocks</a>
                <a href="#">F&O</a>
                <a href="#" class="active">Mutual Funds</a>
                <a href="#">More</a>
            </div>
            <div class="nav-right">
                <div class="search-bar">
                    <span>🔍</span>
                    <input type="text" placeholder="Search Groww....">
                </div>
                <button class="btn-login">Login/Sign up</button>
            </div>
        </div>
    </nav>

    <div class="main-layout">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <h1>Groww your <span>HDFC</span> wealth</h1>
                <p>Factual insights on Mid-cap, Large-cap, ELSS and more.</p>
                <img src="hero.png" alt="Illustration" class="hero-img">
            </div>
        </section>

        <!-- Floating Chat Sidebar -->
        <aside class="chat-sidebar">
            <div class="chat-card">
                <header class="chat-header">
                    <div class="bot-info">
                        <div class="bot-dot"></div>
                        <h3>HDFC MF Assistant</h3>
                    </div>
                    <div class="header-actions">
                        <button onclick="clearCurrentChat()" class="btn-clear" title="Clear this chat">🧹 Clear</button>
                        <button onclick="createNewThread()" class="btn-new-chat">+ New</button>
                    </div>
                </header>

                <div id="chat-window" class="chat-window">
                    <!-- Messages here -->
                </div>

                <div id="suggestions" class="suggestions-container">
                    <button onclick="useSuggestion('Exit load of Mid-cap?')">Exit Load</button>
                    <button onclick="useSuggestion('Min SIP for ELSS?')">Min SIP</button>
                </div>

                <footer class="input-area">
                    <form id="chat-form" class="input-container">
                        <input type="text" id="user-input" placeholder="Ask about HDFC Funds..." autocomplete="off">
                        <button type="submit">Send</button>
                    </form>
                    <div class="disclaimer">Facts-only. No investment advice.</div>
                </footer>
            </div>

            <div class="thread-history">
                <h4>Recent Chats</h4>
                <div id="thread-list" class="thread-list"></div>
            </div>
        </aside>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');
        const threadList = document.getElementById('thread-list');
        
        let currentThreadId = localStorage.getItem('currentThreadId');
        let threads = JSON.parse(localStorage.getItem('groww_threads')) || {};

        function saveToStorage() {
            localStorage.setItem('groww_threads', JSON.stringify(threads));
            localStorage.setItem('currentThreadId', currentThreadId);
        }

        function createNewThread() {
            const defaultName = 'Query ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const userProvidedName = prompt("Enter a name for this chat:", defaultName);
            
            // If user cancels the prompt, don't create a new thread
            if (userProvidedName === null) return;

            const name = userProvidedName.trim() || defaultName;
            const id = 'thread_' + Date.now();
            currentThreadId = id;
            threads[id] = {
                name: name,
                messages: [{ text: "Hello! I am your HDFC Mutual Fund Assistant. How may I help you today?", type: 'bot' }]
            };
            saveToStorage();
            renderThreads();
            switchThread(id);
        }

        function useSuggestion(text) {
            userInput.value = text;
            chatForm.dispatchEvent(new Event('submit'));
        }

        function renderThreads() {
            threadList.innerHTML = '';
            const sortedIds = Object.keys(threads).sort((a,b) => b.split('_')[1] - a.split('_')[1]);
            sortedIds.forEach(id => {
                const div = document.createElement('div');
                div.className = `thread-item ${id === currentThreadId ? 'active' : ''}`;
                div.innerHTML = `
                    <span onclick="switchThread('${id}')" class="thread-name-text">${threads[id].name}</span>
                    <div class="thread-actions">
                        <button onclick="renameThread('${id}')" title="Rename">✎</button>
                        <button onclick="deleteThread('${id}')" title="Delete" class="delete-btn">✕</button>
                    </div>
                `;
                threadList.appendChild(div);
            });
        }

        function deleteThread(id) {
            if (Object.keys(threads).length <= 1) {
                alert("You must have at least one chat open.");
                return;
            }
            if (confirm("Delete this chat?")) {
                delete threads[id];
                if (currentThreadId === id) {
                    currentThreadId = Object.keys(threads)[0];
                }
                saveToStorage();
                renderThreads();
                switchThread(currentThreadId);
            }
        }

        function clearCurrentChat() {
            if (confirm("Restart this conversation?")) {
                threads[currentThreadId].messages = [{ 
                    text: "Hello! I am your HDFC Mutual Fund Assistant. How may I help you today?", 
                    type: 'bot' 
                }];
                saveToStorage();
                switchThread(currentThreadId);
            }
        }

        function switchThread(id) {
            currentThreadId = id;
            saveToStorage();
            clearChatWindow();
            const threadMessages = threads[id].messages;
            threadMessages.forEach(msg => addMessage(msg.text, msg.type, false));
            document.getElementById('suggestions').style.display = threadMessages.length > 1 ? 'none' : 'flex';
            renderThreads();
        }

        function clearChatWindow() {
            chatWindow.innerHTML = '';
        }

        function addMessage(text, type, save = true) {
            if (save && currentThreadId) {
                threads[currentThreadId].messages.push({ text, type });
                saveToStorage();
                document.getElementById('suggestions').style.display = 'none';
            }
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            let content = `<div class="message-content">${text.replace(/\n/g, '<br>')}</div>`;
            
            // Add feedback thumbs only for bot messages
            if (type === 'bot') {
                content += `
                    <div class="feedback-thumbs">
                        <button onclick="handleFeedback(this, 'up')" title="Helpful">👍</button>
                        <button onclick="handleFeedback(this, 'down')" title="Not helpful">👎</button>
                    </div>
                `;
            }
            
            div.innerHTML = content;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleFeedback(btn, type) {
            const container = btn.parentElement;
            container.innerHTML = `<span class="feedback-thanks">Thanks for your feedback!</span>`;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = userInput.value.trim();
            if (!msg) return;

            // Remove feedback thumbs from previous messages
            document.querySelectorAll('.feedback-thumbs').forEach(el => el.remove());

            addMessage(msg, 'user');
            userInput.value = '';

            const loading = document.createElement('div');
            loading.className = 'message bot loading';
            loading.innerText = 'Analyzing facts...';
            chatWindow.appendChild(loading);

            try {
                // Change this to your Render URL after deployment
                const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                                ? '' 
                                : 'https://milestone2-90i6.onrender.com';

                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, thread_id: currentThreadId })
                });
                const data = await response.json();
                chatWindow.removeChild(loading);
                addMessage(data.reply, 'bot');
            } catch (err) {
                loading.innerText = 'Error connecting to server.';
            }
        });

        if (Object.keys(threads).length > 0) {
            if (!currentThreadId || !threads[currentThreadId]) {
                currentThreadId = Object.keys(threads)[0];
            }
            renderThreads();
            switchThread(currentThreadId);
        } else {
            createNewThread();
        }
    </script>
</body>
</html>
