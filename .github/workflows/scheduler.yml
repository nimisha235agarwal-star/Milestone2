name: Daily Data Ingestion

on:
  schedule:
    # Runs every day at 3:45 AM UTC = 9:15 AM IST
    - cron: '45 3 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest-pipeline:
    runs-on: ubuntu-latest

    env:
      CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
      CHROMA_TENANT: ${{ secrets.CHROMA_TENANT }}
      CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}

    steps:
      # ─── Setup ───────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─── Step 1: Scrape latest data from Groww URLs ──────
      - name: Scrape Latest Fund Data
        run: |
          echo "▶ Step 1/3 — Scraping latest HTML from Groww..."
          python src/phase4_scheduler_scraping/scraper.py

      # ─── Step 2: Chunk scraped HTML into semantic pieces ─
      # ─── Step 3: Create embeddings & push to Chroma Cloud ─
      - name: Chunk, Embed & Push to Chroma Cloud
        run: |
          echo "▶ Step 2/3 — Chunking HTML into semantic pieces..."
          echo "▶ Step 3/3 — Creating embeddings & upserting to Chroma Cloud..."
          python src/phase2_chunking_embedding/embedder.py

      # ─── Artifacts (for debugging / audit) ───────────────
      - name: Upload Scraped HTML (Audit Trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-html-${{ github.run_number }}
          path: data/raw_html/
          retention-days: 7
